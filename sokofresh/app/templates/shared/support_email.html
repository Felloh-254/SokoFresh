<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Support Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    h2 {
      color: #2c3e50;
    }
    p {
      line-height: 1.6;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📬 New Support Message</h2>

    <p><strong>Subject:</strong> {{ user_subject }}</p>
    <p><strong>Name:</strong> {{ user_name }}</p>
    <p><strong>Email:</strong> {{ user_email }}</p>
    <p><strong>Phone:</strong> {{ phone }}</p>

    <hr>

    <p><strong>Message:</strong></p>
    <p>{{ message }}</p>

    <div class="footer">
      <p>&copy; {{ current_year }} SokoFresh Support</p>
    </div>
  </div>
</body>
</html>
